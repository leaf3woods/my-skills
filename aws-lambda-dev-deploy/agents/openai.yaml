interface:
  display_name: "AWS Lambda Dev Deploy"
  short_description: "仅更新 $LATEST，测试后还原原始 Lambda 包"
  default_prompt: "Use $aws-lambda-dev-deploy to back up the live Lambda package, upload my staged Lambda changes to $LATEST for testing, and restore the backup after the test passes."

policy:
  allow_implicit_invocation: true
